name: Build portable Windows firmware installer
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*" ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      POKELDN_DISPLAY: T_DONGLE_S3
    steps:
      - uses: actions/checkout@v4
      - name: Test onboard theme selector and pixel renderer
        run: |
          mkdir -p /tmp/pocketcalm-theme-tests
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Wno-format-truncation \
            -I firmware/esp32/main \
            tools/theme_preview.c firmware/esp32/main/screen.c \
            firmware/esp32/main/scene.c firmware/esp32/main/tdongle_render.c \
            -lm -o /tmp/pocketcalm-theme-tests/test
          /tmp/pocketcalm-theme-tests/test /tmp/pocketcalm-theme-tests
      - name: Install ESP-IDF 6.1
        uses: espressif/install-esp-idf-action@v1
        with:
          version: 'v6.1'
      - name: Build ESP32-S3 firmware
        run: |
          idf.py -C firmware/esp32 set-target esp32s3
          idf.py -C firmware/esp32 build
      - name: Merge flash images from IDF output
        run: python3 tools/merge_firmware.py
      - name: Fetch upstream Esptool for Windows
        run: |
          curl --fail --location --retry 3 -o /tmp/esptool.zip \
            https://github.com/espressif/esptool/releases/download/v5.6.0/esptool-v5.6.0-windows-amd64.zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          z = zipfile.ZipFile('/tmp/esptool.zip')
          names = [n for n in z.namelist() if n.lower().endswith('/esptool.exe') or n.lower() == 'esptool.exe']
          assert len(names) == 1, f'Unexpected esptool files: {names}'
          exe = z.read(names[0])
          assert exe[:2] == b'MZ' and len(exe) > 100_000
          Path('flasher/assets/esptool.exe').write_bytes(exe)
          print(f'Using Espressif esptool from official release ({len(exe)} bytes)')
          PY
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Cross-compile portable Windows GUI
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags '-s -w -H windowsgui' \
            -o dist/PokeLDN-PocketCalm-v0.8-Installer.exe ./flasher
      - name: Verify release EXE and merged image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          exe = Path('dist/PokeLDN-PocketCalm-v0.8-Installer.exe').read_bytes()
          image = Path('flasher/assets/firmware-merged.bin').read_bytes()
          assert exe[:2] == b'MZ' and len(exe) > 1_000_000
          assert image[:1] == b'\xe9' and len(image) > 100_000
          print('Windows EXE and firmware look structurally valid.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PocketCalm-v0.8-Windows-Installer
          path: dist/PokeLDN-PocketCalm-v0.8-Installer.exe
      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/PokeLDN-PocketCalm-v0.8-Installer.exe \
            --title "PokéLDN Pocket Calm ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
